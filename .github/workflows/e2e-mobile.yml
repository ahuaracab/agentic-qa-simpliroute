name: Mobile E2E Tests (Maestro)

on:
  repository_dispatch:
    types: [mobile-e2e-trigger]
  workflow_dispatch:
    inputs:
      mobile-ref:
        description: 'Branch/tag/SHA of mobile-demo to build'
        required: false
        default: 'master'

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout QA Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_MOBILE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Mobile Demo Repo
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }} \
            https://github.com/ahuaracab/mobile-demo-e2e.git mobile-demo

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: mobile-demo/node_modules
          key: npm-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/package-lock.json') }}
          restore-keys: |
            npm-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-
            npm-

      - name: Install App Dependencies
        working-directory: mobile-demo
        run: npm ci

      - name: Cache Android Project
        id: cache-android
        uses: actions/cache@v4
        with:
          path: mobile-demo/android
          key: android-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/app.json', 'mobile-demo/package.json', 'mobile-demo/package-lock.json') }}
          restore-keys: |
            android-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-

      - name: Generate Android Project
        if: steps.cache-android.outputs.cache-hit != 'true'
        working-directory: mobile-demo
        run: npx expo prebuild --platform android --no-install

      - name: Force x86_64 Architecture Only
        shell: bash
        run: |
          PROPS="mobile-demo/android/gradle.properties"
          if ! grep -q "reactNativeArchitectures" "$PROPS"; then
            echo "reactNativeArchitectures=x86_64" >> "$PROPS"
          else
            sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' "$PROPS"
          fi

      - name: Bundle React Native JS
        working-directory: mobile-demo
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle Distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-9.3.1

      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ runner.os }}-${{ hashFiles('mobile-demo/android/**/*.gradle', 'mobile-demo/android/gradle.properties') }}
          restore-keys: |
            gradle-caches-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('mobile-demo/android/**/*.gradle') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-accept SDK Licenses
        shell: bash
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > /usr/local/lib/android/sdk/licenses/android-sdk-arm-dbt-license
          echo -e "\ne9acab5b5fbb560a72797e13e6e1c54f5c138524" > /usr/local/lib/android/sdk/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > /usr/local/lib/android/sdk/licenses/google-gdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Build Debug APK
        working-directory: mobile-demo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Copy APK to Test Location
        run: |
          mkdir -p tests/mobile/apk
          cp mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk tests/mobile/apk/app-release.apk

      - name: Setup Maestro
        uses: remarkablemark/setup-maestro-cli@v1

      - name: Enable KVM for Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Emulator & Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "=== DEBUG: Checking emulator status ==="
            adb devices
            adb shell getprop ro.build.display.id

            echo "=== DEBUG: Installing APK ==="
            adb install -r tests/mobile/apk/app-release.apk
            echo "APK install exit code: $?"

            echo "=== DEBUG: Verifying APK is installed ==="
            adb shell pm list packages | grep mobiledemo

            echo "=== DEBUG: Launching app ==="
            adb shell am start -n com.anonymous.mobiledemo/.MainActivity
            sleep 8

            echo "=== DEBUG: Checking if activity is running ==="
            adb shell dumpsys activity activities | grep -A 5 "mobiledemo" | head -20

            echo "=== DEBUG: Screenshot after launch ==="
            adb exec-out screencap -p > /tmp/screenshot-after-launch.png || true
            echo "Screenshot saved: $(ls -la /tmp/screenshot-after-launch.png 2>/dev/null || echo 'FAILED')"

            echo "=== DEBUG: Logcat errors ==="
            adb logcat -d -t 200 | grep -iE "(ReactNative|FATAL|Error|Exception|crash)" | tail -50 > /tmp/logcat-errors.txt
            cat /tmp/logcat-errors.txt

            echo "=== DEBUG: UI Automator hierarchy (what Maestro sees) ==="
            adb shell uiautomator dump /sdcard/window_dump.xml
            adb pull /sdcard/window_dump.xml /tmp/window_dump.xml || true
            cat /tmp/window_dump.xml | head -100

            echo "=== DEBUG: Full logcat for this app (last 500 lines) ==="
            PID=$(adb shell pidof com.anonymous.mobiledemo)
            echo "App PID: $PID"
            adb logcat -d --pid=$PID | tail -200 > /tmp/logcat-app.txt
            cat /tmp/logcat-app.txt

            echo "=== Running Maestro tests ==="
            maestro test tests/mobile/.maestro/

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            ~/.maestro/tests/
            /tmp/screenshot-after-launch.png
            /tmp/logcat-errors.txt
            /tmp/logcat-app.txt
            /tmp/window_dump.xml
          retention-days: 14
