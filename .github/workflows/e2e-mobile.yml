name: Mobile E2E Tests (Maestro)

on:
  repository_dispatch:
    types: [mobile-e2e-trigger]
  workflow_dispatch:
    inputs:
      mobile-ref:
        description: 'Branch/tag/SHA of mobile-demo to build'
        required: false
        default: 'master'

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout QA Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_MOBILE }}

      - name: Clone Mobile Demo Repo
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }} \
            https://github.com/ahuaracab/mobile-demo-e2e.git mobile-demo

      - name: Restore npm cache
        uses: actions/cache/restore@v4
        with:
          path: mobile-demo/node_modules
          key: npm-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/package-lock.json') }}
          restore-keys: |
            npm-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-
            npm-

      - name: Install App Dependencies
        working-directory: mobile-demo
        run: npm ci

      - name: Restore Android project cache
        id: cache-android
        uses: actions/cache/restore@v4
        with:
          path: mobile-demo/android
          key: android-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/app.json', 'mobile-demo/package.json', 'mobile-demo/package-lock.json') }}
          restore-keys: |
            android-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-

      - name: Generate Android Project
        if: steps.cache-android.outputs.cache-hit != 'true'
        working-directory: mobile-demo
        run: npx expo prebuild --platform android --no-install

      - name: Force x86_64 Architecture Only
        shell: bash
        run: |
          PROPS="mobile-demo/android/gradle.properties"
          if ! grep -q "reactNativeArchitectures" "$PROPS"; then
            echo "reactNativeArchitectures=x86_64" >> "$PROPS"
          else
            sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' "$PROPS"
          fi

      - name: Bundle React Native JS
        working-directory: mobile-demo
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Restore Gradle distribution cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: v2-gradle-dist-${{ runner.os }}-9.3.1

      - name: Restore Gradle caches
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches
          key: v2-gradle-caches-${{ runner.os }}-${{ hashFiles('mobile-demo/android/**/*.gradle', 'mobile-demo/android/gradle.properties') }}
          restore-keys: |
            v2-gradle-caches-${{ runner.os }}-

      - name: Detect Java path
        id: java
        run: |
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "path=$JAVA_PATH" >> $GITHUB_OUTPUT
          echo "JAVA_HOME=$JAVA_PATH" >> $GITHUB_ENV

      - name: Pre-accept SDK Licenses
        shell: bash
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > /usr/local/lib/android/sdk/licenses/android-sdk-arm-dbt-license
          echo -e "\ne9acab5b5fbb560a72797e13e6e1c54f5c138524" > /usr/local/lib/android/sdk/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > /usr/local/lib/android/sdk/licenses/google-gdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Build Debug APK
        working-directory: mobile-demo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Copy APK to Test Location
        run: |
          mkdir -p tests/mobile/apk
          cp mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk tests/mobile/apk/app-release.apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM for Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Emulator & Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "=== Disable Pixel Launcher to prevent ANR ==="
            adb shell pm disable-user com.google.android.apps.nexuslauncher 2>/dev/null || true
            adb shell pm disable-user com.android.launcher3 2>/dev/null || true
            adb shell input keyevent KEYCODE_BACK 2>/dev/null || true
            sleep 2

            echo "=== Installing APK ==="
            adb install -r tests/mobile/apk/app-release.apk

            echo "=== Running Maestro tests ==="
            maestro test tests/mobile/.maestro/ --format junit --output /tmp/maestro-results.xml

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            /tmp/maestro-results.xml
            ~/.maestro/tests/
          retention-days: 14

      - name: Save npm cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: mobile-demo/node_modules
          key: npm-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/package-lock.json') }}

      - name: Save Android project cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: mobile-demo/android
          key: android-${{ github.event.inputs.mobile-ref || github.event.client_payload.ref || 'master' }}-${{ hashFiles('mobile-demo/app.json', 'mobile-demo/package.json', 'mobile-demo/package-lock.json') }}

      - name: Save Gradle distribution cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: v2-gradle-dist-${{ runner.os }}-9.3.1

      - name: Save Gradle caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches
          key: v2-gradle-caches-${{ runner.os }}-${{ hashFiles('mobile-demo/android/**/*.gradle', 'mobile-demo/android/gradle.properties') }}
