# ============================================
# Setup Target Mobile — NON-DOCTRINE PIECE
# ============================================
# Clones the mobile-demo repo, builds the release APK and places it where
# test:mobile:install expects it (tests/mobile/apk/app-release.apk).

name: Setup Target Mobile (Build APK)
description: >
  Clone the mobile-demo repository, build the Android release APK and
  cache it for the Maestro E2E tests.

inputs:
  repo:
    description: Mobile target repository (owner/name)
    required: false
    default: ahuaracab/mobile-demo-e2e
  ref:
    description: Branch/tag/SHA to check out
    required: false
    default: master
  java-version:
    description: Java version for the Gradle build
    required: false
    default: '17'
  apk-dest:
    description: Destination path for the APK (relative to workspace root)
    required: false
    default: tests/mobile/apk/app-release.apk

runs:
  using: composite
  steps:
    - name: Clone Mobile Demo Repo
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.ref }} \
          https://github.com/${{ inputs.repo }}.git mobile-demo

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Release APK
      shell: bash
      working-directory: mobile-demo/android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK Destination
      shell: bash
      run: mkdir -p "$(dirname "${{ inputs.apk-dest }}")"

    - name: Copy APK to Test Location
      shell: bash
      run: |
        cp mobile-demo/android/app/build/outputs/apk/release/app-release.apk \
           "${{ inputs.apk-dest }}"
        echo "APK ready at ${{ inputs.apk-dest }}"
        ls -lh "${{ inputs.apk-dest }}"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ inputs.apk-dest }}
        retention-days: 7
