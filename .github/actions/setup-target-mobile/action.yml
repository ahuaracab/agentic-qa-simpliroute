# ============================================
# Setup Target Mobile — NON-DOCTRINE PIECE
# ============================================
# Clones the mobile-demo repo, generates the Android project with
# expo prebuild, builds the debug APK and places it where
# test:mobile:install expects it.

name: Setup Target Mobile (Build APK)
description: >
  Clone the mobile-demo repository, generate Android native project,
  build the debug APK and cache it for the Maestro E2E tests.

inputs:
  repo:
    description: Mobile target repository (owner/name)
    required: false
    default: ahuaracab/mobile-demo-e2e
  ref:
    description: Branch/tag/SHA to check out
    required: false
    default: master
  java-version:
    description: Java version for the Gradle build
    required: false
    default: '17'
  apk-dest:
    description: Destination path for the APK (relative to workspace root)
    required: false
    default: tests/mobile/apk/app-release.apk

runs:
  using: composite
  steps:
    - name: Clone Mobile Demo Repo
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.ref }} \
          https://github.com/${{ inputs.repo }}.git mobile-demo

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: mobile-demo/node_modules
        key: npm-${{ inputs.ref }}-${{ hashFiles('mobile-demo/package-lock.json') }}
        restore-keys: |
          npm-${{ inputs.ref }}-
          npm-

    - name: Install App Dependencies
      shell: bash
      working-directory: mobile-demo
      run: npm ci

    - name: Cache Android Project
      id: cache-android
      uses: actions/cache@v4
      with:
        path: mobile-demo/android
        key: android-${{ inputs.ref }}-${{ hashFiles('mobile-demo/app.json', 'mobile-demo/package.json', 'mobile-demo/package-lock.json') }}
        restore-keys: |
          android-${{ inputs.ref }}-

    - name: Generate Android Project
      if: steps.cache-android.outputs.cache-hit != 'true'
      shell: bash
      working-directory: mobile-demo
      run: npx expo prebuild --platform android --no-install

    - name: Force x86_64 Architecture Only
      shell: bash
      run: |
        PROPS="mobile-demo/android/gradle.properties"
        if ! grep -q "reactNativeArchitectures" "$PROPS"; then
          echo "reactNativeArchitectures=x86_64" >> "$PROPS"
        else
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=x86_64/' "$PROPS"
        fi
        echo "=== gradle.properties ==="
        grep -E "react|architect" "$PROPS" || true

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Cache Gradle Distribution
      uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper/dists
        key: gradle-dist-${{ runner.os }}-9.3.1

    - name: Cache Gradle Caches
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-caches-${{ runner.os }}-${{ hashFiles('mobile-demo/android/**/*.gradle', 'mobile-demo/android/gradle.properties') }}
        restore-keys: |
          gradle-caches-${{ runner.os }}-

    - name: Cache Android SDK, NDK & CMake
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk
        key: android-full-${{ runner.os }}-v3
        restore-keys: |
          android-full-${{ runner.os }}-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Pre-accept SDK Licenses
      shell: bash
      run: |
        mkdir -p /usr/local/lib/android/sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
        echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > /usr/local/lib/android/sdk/licenses/android-sdk-arm-dbt-license
        echo -e "\ne9acab5b5fbb560a72797e13e6e1c54f5c138524" > /usr/local/lib/android/sdk/licenses/intel-android-extra-license
        echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > /usr/local/lib/android/sdk/licenses/google-gdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

    - name: Bundle React Native JS
      shell: bash
      working-directory: mobile-demo
      run: |
        npm install --save-dev @react-native-community/cli @react-native-community/cli-platform-android @react-native/metro-config
        printf "const { getDefaultConfig } = require('expo/metro-config');\nmodule.exports = getDefaultConfig(__dirname);\n" > metro.config.js
        mkdir -p android/app/src/main/assets
        npx react-native bundle \
          --platform android \
          --dev false \
          --entry-file index.ts \
          --bundle-output android/app/src/main/assets/index.android.bundle \
          --assets-dest android/app/src/main/res

    - name: Build Debug APK
      shell: bash
      working-directory: mobile-demo/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug \
          --no-daemon \
          --parallel \
          --build-cache \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
          -x lint \
          -x lintVitalAnalyzeRelease \
          -x lintVitalReportRelease

    - name: Prepare APK Destination
      shell: bash
      run: mkdir -p "$(dirname "${{ inputs.apk-dest }}")"

    - name: Copy APK to Test Location
      shell: bash
      run: |
        cp mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk \
           "${{ inputs.apk-dest }}"
        echo "APK ready at ${{ inputs.apk-dest }}"
        ls -lh "${{ inputs.apk-dest }}"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ inputs.apk-dest }}
        retention-days: 7
