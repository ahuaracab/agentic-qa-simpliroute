# ============================================
# Setup Target Backend — NON-DOCTRINE PIECE
# ============================================
# The KATA CI doctrine (ci-cd-integration.md) assumes the target is reachable
# via a deployed URL supplied as secrets. Route Optimizer only runs locally
# (no staging/prod deploy), so CI must stand the target up itself before any
# suite can run. This action clones the target repo, installs the backend,
# migrates the sqlite DB and starts `runserver` in the background inside the
# SAME runner/job — tests hit 127.0.0.1:8000 as they do locally.
#
# Target repo is public — anonymous checkout works (GITHUB_TOKEN default).
#
# ROUTING_OSRM=0: el target por defecto intenta OSRM real (red externa) en cada
# optimización y degrada a heurística tras 5s. Para determinismo/velocidad en
# CI se desactiva (misma decisión que el conftest.py del propio target).

name: Setup Target Backend
description: Clone the route-optimizer target, install backend deps, migrate and start the Django dev server.

inputs:
  repo:
    description: Target repository (owner/name)
    required: false
    default: ahuaracab/route-optimizer
  ref:
    description: Branch/tag/SHA to check out
    required: false
    default: main
  backend-path:
    description: Path to the backend dir inside the target repo (relative to workspace)
    required: false
    default: route-optimizer/backend
  python-version:
    description: Python version for the target backend
    required: false
    default: '3.13'

runs:
  using: composite
  steps:
    - name: Checkout Target Repo
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: route-optimizer
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Backend Dependencies
      shell: bash
      working-directory: ${{ inputs.backend-path }}
      run: pip install -r requirements.txt

    - name: Run Database Migrations
      shell: bash
      working-directory: ${{ inputs.backend-path }}
      run: python manage.py migrate --noinput

    - name: Start Backend Server
      shell: bash
      working-directory: ${{ inputs.backend-path }}
      env:
        PYTHONUNBUFFERED: '1'
        ROUTING_OSRM: '0'
      run: |-
        nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/django-server.log 2>&1 &
        echo "Django runserver started (pid $!)"
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/api/vehicles/ -o /dev/null; then
            echo "Django ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Django did not become ready in time" >&2
        exit 1

    - name: Upload Server Logs on Failure
      if: failure()
      shell: bash
      run: cat /tmp/django-server.log
