appId: com.anonymous.mobiledemo
---
- launchApp
- extendedWaitUntil:
    visible: Demo E2E Mobile
    timeout: 30000

# Test 1: Verify main title
- assertVisible:
    text: Demo E2E Mobile

# Test 2: Greeting flow
- tapOn:
    id: name-input
- inputText: Tester
- tapOn:
    id: greet-button
- assertVisible:
    text: Hola Tester!

# Test 3: Counter - increment x3
- tapOn:
    id: increment-button
- tapOn:
    id: increment-button
- tapOn:
    id: increment-button
- assertVisible:
    id: counter-value
    text: 3

# Test 4: Counter - decrement
- tapOn:
    id: decrement-button
- assertVisible:
    id: counter-value
    text: 2

# Test 5: Counter - go negative
- tapOn:
    id: decrement-button
- tapOn:
    id: decrement-button
- tapOn:
    id: decrement-button
- assertVisible:
    id: counter-value
    text: -1
