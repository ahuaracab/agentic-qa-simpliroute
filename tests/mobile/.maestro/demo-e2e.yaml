appId: com.anonymous.mobiledemo
---
- launchApp
- extendedWaitUntil:
    visible: Demo E2E Mobile
    timeout: 30000

# Test 1: Verify main title
- assertVisible:
    id: main-title

# Test 2: Greeting flow
- tapOn:
    id: name-input
- inputText: Tester
- tapOn:
    id: greet-button
- assertVisible:
    id: greeting-text

# Test 3: Counter - wait for increment button, then increment x3
- extendedWaitUntil:
    visible:
      id: increment-button
    timeout: 10000
- tapOn:
    id: increment-button
- tapOn:
    id: increment-button
- tapOn:
    id: increment-button
- assertVisible:
    id: counter-value

# Test 4: Counter - decrement
- tapOn:
    id: decrement-button
- assertVisible:
    id: counter-value

# Test 5: Counter - go negative
- tapOn:
    id: decrement-button
- tapOn:
    id: decrement-button
- tapOn:
    id: decrement-button
- assertVisible:
    id: counter-value
